name: Links
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly external link check, Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links:
    name: Check links on the organization page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml "./**/*.md"
          fail: true
